name: Record iPhone 18 Pro Max demo

on:
  push:
    paths-ignore:
      - "Recordings/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: record-${{ github.ref }}
  cancel-in-progress: true

env:
  SIMULATOR_NAME: iPhone 18 Pro Max
  RECORDINGS: ${{ github.workspace }}/Recordings

jobs:
  record:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sudo xcode-select -s /Applications/Xcode_27.app || true
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available | grep -i "iphone 18" || true

      - name: Find Iceland photos on Wikimedia Commons
        run: python3 scripts/fetch_photos.py

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick simulator
        id: sim
        run: echo "udid=$(python3 scripts/find_simulator.py "$SIMULATOR_NAME")" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Iceland.xcodeproj -scheme Iceland \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build | tail -n 40

      - name: Boot simulator
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          # Let the home screen settle before recording starts.
          sleep 20

      - name: Record UI tour
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          rm -rf "$RECORDINGS/screenshots"
          mkdir -p "$RECORDINGS/screenshots" raw
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force raw/iceland-demo.mp4 > raw/record.log 2>&1 &
          REC_PID=$!
          # recordVideo can take close to a minute to attach to the display.
          for _ in $(seq 1 600); do
            grep -q "Recording started" raw/record.log && break
            sleep 0.2
          done
          # Wall-clock start of the video, used to line up the test's TOUR_START/TOUR_END markers.
          python3 -c 'import time; print(time.time())' > raw/record-start.txt
          cat raw/record.log
          sleep 2

          set +e
          xcodebuild test-without-building \
            -project Iceland.xcodeproj -scheme Iceland \
            -destination "id=$UDID" \
            -derivedDataPath build \
            -resultBundlePath raw/UITour.xcresult \
            -collect-test-diagnostics never \
            -only-testing:IcelandUITests/AppTourUITests/testAppTour > raw/xcodebuild-test.log 2>&1 &
          TEST_PID=$!

          # Grab a still every few seconds while the tour runs.
          i=0
          while kill -0 "$TEST_PID" 2>/dev/null; do
            sleep 5
            i=$((i + 1))
            shot="$RECORDINGS/screenshots/$(printf '%03d' "$i").jpg"
            xcrun simctl io "$UDID" screenshot --type=jpeg "$shot" >/dev/null 2>&1 && sips -Z 900 "$shot" >/dev/null 2>&1
          done
          wait "$TEST_PID"
          STATUS=$?
          sleep 2

          kill -INT "$REC_PID"
          wait "$REC_PID"
          tail -n 60 raw/xcodebuild-test.log
          ls -lh raw/iceland-demo.mp4 "$RECORDINGS/screenshots"
          exit $STATUS

      # Cut the home screen / launch screen before the tour and the teardown after it, and
      # re-encode: the raw simulator capture is ~150 MB at full resolution, too big to commit.
      - name: Trim and compress video
        if: always() && hashFiles('raw/iceland-demo.mp4') != ''
        run: |
          brew install ffmpeg
          python3 scripts/trim_video.py raw/iceland-demo.mp4 raw/xcodebuild-test.log \
            "$(cat raw/record-start.txt)" "$RECORDINGS/iceland-iphone18promax.mp4"
          ls -lh "$RECORDINGS/iceland-iphone18promax.mp4"

      - name: Upload recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iceland-iphone18promax-demo
          path: |
            Recordings/
            raw/iceland-demo.mp4
            raw/xcodebuild-test.log
            raw/UITour.xcresult
          if-no-files-found: warn

      # Screenshots are committed even when the tour fails so the run can be inspected without
      # downloading the artifact; the video is only committed for a successful tour.
      - name: Commit recording to the branch
        if: always() && github.ref_type == 'branch' && steps.sim.outcome == 'success'
        env:
          TOUR_OK: ${{ job.status == 'success' }}
        run: |
          video="$RECORDINGS/iceland-iphone18promax.mp4"
          if [ "$TOUR_OK" != "true" ]; then
            rm -f "$video"
          elif [ "$(stat -f%z "$video")" -gt 95000000 ]; then
            echo "Video is too large to commit; it is still available as an artifact."
            rm -f "$video"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Recordings
          if [ "$TOUR_OK" = "true" ]; then msg="Add iPhone 18 Pro Max demo recording [skip ci]"; else msg="Add screenshots from failed demo run [skip ci]"; fi
          git commit -m "$msg" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

name: Iceland
options:
  bundleIdPrefix: com.peterpanswift
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Iceland:
    type: application
    platform: iOS
    sources:
      - path: Iceland
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peterpanswift.iceland
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 冰島之旅
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  IcelandUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: IcelandUITests
    dependencies:
      - target: Iceland
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.peterpanswift.iceland.uitests
        TEST_TARGET_NAME: Iceland
schemes:
  Iceland:
    build:
      targets:
        Iceland: all
        IcelandUITests: [test]
    test:
      targets:
        - IcelandUITests
